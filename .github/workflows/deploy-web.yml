name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Wrangler environment to deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build OpenNext bundle
        working-directory: apps/web
        run: npx opennextjs-cloudflare build

      - name: Apply D1 migrations
        working-directory: apps/web
        run: |
          if [ "${DEPLOY_ENV}" = "preview" ]; then
            npm run db:migrate:preview
          else
            npm run db:migrate
          fi

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: |
          if [ "${DEPLOY_ENV}" = "preview" ]; then
            npx opennextjs-cloudflare deploy --env preview
          else
            npx opennextjs-cloudflare deploy
          fi
