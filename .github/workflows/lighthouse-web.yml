name: Lighthouse Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://ai-yu-me.com
      NEXT_PUBLIC_LINE_URL: https://line.me/
      NEXT_PUBLIC_BOOKING_URL: https://example.com/booking
      NEXT_PUBLIC_CONTACT_EMAIL: hello@ai-yu-me.com
      NEXT_PUBLIC_LABS_URL: https://labs.ai-yu-me.com/void-rush
      NEXT_PUBLIC_SANITY_DATASET: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: npm run test:lighthouse
