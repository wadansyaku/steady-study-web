name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: Manual CI mode
        required: true
        default: domain-inspect
        type: choice
        options:
          - domain-inspect
          - domain-migrate

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_URL: https://ai-yu-me.com
      PUBLIC_LINE_URL: https://line.me/
      PUBLIC_BOOKING_URL: https://example.com/booking
      PUBLIC_CONTACT_EMAIL: hello@ai-yu-me.com
      PUBLIC_ANALYTICS_ENABLED: 'false'
      PUBLIC_ANALYTICS_SNIPPET: ''
      PUBLIC_VOIDRUSH_API_BASE_URL: /api/voidrush
      PUBLIC_AMAZON_ASSOCIATE_TAG: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Build Output
        run: npm run validate:build

  domain-ops:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT_NAME: aiyume-web
      WORKER_NAME: aiyoume-web
      ZONE_NAME: ai-yu-me.com
      DOMAINS_JSON: '["ai-yu-me.com","www.ai-yu-me.com"]'

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          test -n "${ACCOUNT_ID}"
          test -n "${CF_API_TOKEN}"

      - name: Verify token
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq .

      - name: Inspect Pages domains and DNS
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" | jq .

          zone_id="$(
            curl -fsS \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" |
              jq -r '.result[0].id'
          )"

          test -n "${zone_id}"
          test "${zone_id}" != "null"
          echo "ZONE_ID=${zone_id}" >> "${GITHUB_ENV}"

          for hostname in $(jq -r '.[]' <<<"${DOMAINS_JSON}"); do
            echo "::group::DNS ${hostname}"
            curl -fsS \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${hostname}" | jq .
            echo "::endgroup::"
          done

      - name: Remove Pages custom domains
        if: ${{ inputs.mode == 'domain-migrate' }}
        run: |
          set -euo pipefail
          for hostname in $(jq -r '.[]' <<<"${DOMAINS_JSON}"); do
            echo "::group::DELETE Pages domain ${hostname}"
            curl -fsS -X DELETE \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains/${hostname}" | jq .
            echo "::endgroup::"
          done

      - name: Remove conflicting DNS records
        if: ${{ inputs.mode == 'domain-migrate' }}
        run: |
          set -euo pipefail
          for hostname in $(jq -r '.[]' <<<"${DOMAINS_JSON}"); do
            record_ids="$(
              curl -fsS \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${hostname}" |
                jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id'
            )"

            if [ -z "${record_ids}" ]; then
              echo "No A/AAAA/CNAME records to delete for ${hostname}"
              continue
            fi

            for record_id in ${record_ids}; do
              echo "::group::DELETE DNS ${hostname} ${record_id}"
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${record_id}" | jq .
              echo "::endgroup::"
            done
          done

      - name: Attach Worker custom domains
        if: ${{ inputs.mode == 'domain-migrate' }}
        run: |
          set -euo pipefail
          jq -n \
            --arg zone_name "${ZONE_NAME}" \
            '{
              override_scope: true,
              override_existing_origin: true,
              override_existing_dns_record: true,
              origins: [
                { hostname: "ai-yu-me.com", zone_name: $zone_name },
                { hostname: "www.ai-yu-me.com", zone_name: $zone_name }
              ]
            }' > request.json

          cat request.json | jq .

          curl -fsS -X PUT \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @request.json \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/domains/records" | jq .

      - name: Verify Worker domains and live URLs
        if: ${{ inputs.mode == 'domain-migrate' }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/domains" | jq .

          sleep 15
          curl -I -s https://ai-yu-me.com
          curl -I -s https://www.ai-yu-me.com
