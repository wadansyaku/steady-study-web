name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://ai-yu-me.com
      NEXT_PUBLIC_LINE_URL: https://line.me/
      NEXT_PUBLIC_BOOKING_URL: https://example.com/booking
      NEXT_PUBLIC_CONTACT_EMAIL: hello@ai-yu-me.com
      NEXT_PUBLIC_LABS_URL: https://labs.ai-yu-me.com/void-rush
      NEXT_PUBLIC_SANITY_DATASET: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Playwright E2E
        run: npm run test:e2e
